# Valores enxutos para AWS Academy (2× t3.medium, disco limitado).
# Release name esperado: kube-prometheus-stack (label release nos ServiceMonitors).

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 24h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    secrets:
      - alertmanager-integrations
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "exported_service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        - receiver: oncall
          matchers:
            - team = "toggle-master"
            - severity = "critical"
        - receiver: chatops
          matchers:
            - team = "toggle-master"
            - severity = "warning"
    inhibit_rules:
      - source_matchers:
          - team = "toggle-master"
          - severity = "critical"
        target_matchers:
          - team = "toggle-master"
          - severity = "warning"
        equal:
          - exported_service
    receivers:
      - name: "null"
      - name: oncall
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-integrations/pagerduty-routing-key
            send_resolved: true
            severity: critical
            client: Alertmanager ToggleMaster
            client_url: "{{ .ExternalURL }}"
            description: '{{ template "togglemaster.pagerduty.description" . }}'
            details:
              service: "{{ .CommonLabels.exported_service }}"
              deployment: "{{ .CommonLabels.deployment }}"
              summary: "{{ .CommonAnnotations.summary }}"
              descricao: "{{ .CommonAnnotations.description }}"
              runbook: "{{ .CommonAnnotations.runbook_url }}"
              self_healing: "{{ .CommonLabels.self_heal }}"
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-integrations/discord-webhook-url
            send_resolved: true
            title: '{{ template "togglemaster.discord.title" . }}'
            message: '{{ template "togglemaster.discord.message" . }}'
        webhook_configs:
          - url: http://self-healing.monitoring.svc:8080/alerts
            send_resolved: false
            max_alerts: 10
            timeout: 10s
      - name: chatops
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-integrations/discord-webhook-url
            send_resolved: true
            title: '{{ template "togglemaster.discord.title" . }}'
            message: '{{ template "togglemaster.discord.message" . }}'
    templates:
      - /etc/alertmanager/config/*.tmpl
  templateFiles:
    togglemaster.tmpl: |-
      {{ define "togglemaster.discord.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} — {{ .CommonLabels.exported_service }}
      {{- end }}

      {{ define "togglemaster.discord.message" -}}
      {{ range .Alerts -}}
      **{{ .Annotations.summary }}**
      {{ .Annotations.description }}
      • Severidade: `{{ .Labels.severity }}`
      • Serviço: `{{ .Labels.exported_service }}` (namespace `{{ .Labels.exported_namespace }}`)
      • Self-healing: `{{ if eq .Labels.self_heal "true" }}rollout restart deployment/{{ .Labels.deployment }}{{ else }}não{{ end }}`
      • Início: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}{{ if eq .Status "resolved" }} · Fim: {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}{{ end }}
      • Runbook: {{ .Annotations.runbook_url }}
      • Query: {{ .GeneratorURL }}
      {{ end -}}
      {{- end }}

      {{ define "togglemaster.pagerduty.description" -}}
      [ToggleMaster] {{ .CommonLabels.alertname }} em {{ .CommonLabels.exported_service }}: {{ .CommonAnnotations.summary }}
      {{- end }}

grafana:
  adminPassword: togglemaster
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      isDefault: false
      jsonData:
        maxLines: 1000
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      default_theme: dark

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 30s
    evaluationInterval: 30s
    enableRemoteWriteReceiver: true
    replicas: 1
    shards: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    # Aceita ServiceMonitors de qualquer namespace (ingress-nginx incluso).
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    # Fallback: scrape do Service de metrics do ingress via annotation.
    additionalScrapeConfigs:
      - job_name: ingress-nginx
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ingress-nginx
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: ingress-nginx
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Control plane EKS gerenciado — scrapes internos não aplicam.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
