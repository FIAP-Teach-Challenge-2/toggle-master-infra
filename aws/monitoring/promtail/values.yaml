# Promtail DaemonSet → Loki SingleBinary no namespace monitoring.
# Scrape padrão do chart (todos os pods); só aponta o client.

config:
  clients:
    - url: http://loki.monitoring.svc:3100/loki/api/v1/push

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

tolerations:
  - effect: NoSchedule
    operator: Exists
