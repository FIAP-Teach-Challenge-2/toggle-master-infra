apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing
  namespace: monitoring
  labels:
    app.kubernetes.io/name: self-healing
    app.kubernetes.io/part-of: toggle-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: self-healing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-healing
        app.kubernetes.io/part-of: toggle-master
    spec:
      serviceAccountName: self-healing
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: self-healing
          image: python:3.12.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/self_healing.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TARGET_NAMESPACE
              value: toggle-master
            - name: ALLOWED_DEPLOYMENTS
              value: auth-service,flag-service,targeting-service,evaluation-service,analytics-service
            - name: COOLDOWN_SECONDS
              value: "300"
            - name: DISCORD_WEBHOOK_URL_FILE
              value: /etc/self-healing/secrets/discord-webhook-url
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: integrations
              mountPath: /etc/self-healing/secrets
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: self-healing-script
        - name: integrations
          secret:
            secretName: alertmanager-integrations
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing
  namespace: monitoring
  labels:
    app.kubernetes.io/name: self-healing
    app.kubernetes.io/part-of: toggle-master
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: self-healing
  ports:
    - name: http
      port: 8080
      targetPort: http
