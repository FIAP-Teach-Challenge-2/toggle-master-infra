apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing
  namespace: monitoring
  labels:
    app.kubernetes.io/name: self-healing
    app.kubernetes.io/part-of: toggle-master
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-rollout-restart
  namespace: toggle-master
  labels:
    app.kubernetes.io/name: self-healing
    app.kubernetes.io/part-of: toggle-master
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - auth-service
      - flag-service
      - targeting-service
      - evaluation-service
      - analytics-service
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-rollout-restart
  namespace: toggle-master
  labels:
    app.kubernetes.io/name: self-healing
    app.kubernetes.io/part-of: toggle-master
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healing-rollout-restart
subjects:
  - kind: ServiceAccount
    name: self-healing
    namespace: monitoring
