apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - self-healing.yaml

configMapGenerator:
  - name: self-healing-script
    namespace: monitoring
    files:
      - self_healing.py
    options:
      labels:
        app.kubernetes.io/name: self-healing
        app.kubernetes.io/part-of: toggle-master
