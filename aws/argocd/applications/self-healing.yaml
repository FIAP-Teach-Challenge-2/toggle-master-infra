apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-healing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/FIAP-Teach-Challenge-2/toggle-master-infra.git
    targetRevision: cluster/juliette-339712828566
    path: aws/monitoring/self-healing
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
