apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace, Secret `toggle-master-secrets`, ConfigMap `toggle-master-config`
# e ConfigMap `auth-db-init-sql` são criados pelo Terraform
# (terraform/platform) a partir dos endpoints reais da infraestrutura.
# Aplique este kustomization somente depois de `terraform apply` no platform.
namespace: toggle-master

resources:
  - db-init-jobs.yaml
  - apps/auth-service.yaml
  - apps/flag-service.yaml
  - apps/targeting-service.yaml
  - apps/evaluation-service.yaml
  - apps/analytics-service.yaml
  - ingress.yaml
  - hpa.yaml

# Registry e tag das imagens em um único lugar (os Deployments usam só o nome
# do serviço). Troque o ID da conta pelo output `account_id` do stack infra ou
# rode: kustomize edit set image auth-service=<registry>/togglemaster/auth-service:<tag>
# É este bloco que o pipeline de CI atualiza com a tag do commit (GitOps).
images:
  - name: auth-service
    newName: 010533939486.dkr.ecr.us-east-1.amazonaws.com/togglemaster/auth-service
    newTag: latest
  - name: flag-service
    newName: 010533939486.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service
    newTag: latest
  - name: targeting-service
    newName: 010533939486.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting-service
    newTag: latest
  - name: evaluation-service
    newName: 010533939486.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service
    newTag: latest
  - name: analytics-service
    newName: 010533939486.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service
    newTag: latest
